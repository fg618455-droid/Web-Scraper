name: Build & Release Windows .exe

# Triggert automatisch wenn ein Tag wie "v23", "v24" gepusht wird.
# Manuell triggerbar via "Actions" Tab → "Run workflow" (ohne Tag, fuer Tests).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # Wird gebraucht damit der Workflow die .zip ans Release haengen darf

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Python dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Chromium into local play/ folder
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\play
        run: python -m playwright install chromium

      - name: Generate icon.ico (committed file is in .gitignore as app-generated)
        run: python make_icon.py

      - name: Determine version tag (or "manual" for workflow_dispatch)
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          } else {
            $tag = "manual-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "Version: $tag"

      - name: Set version.json from tag (must run BEFORE PyInstaller so .exe ships with correct version)
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = $tag -replace '^v', ''
          @{"version" = $version} | ConvertTo-Json | Set-Content version.json -Encoding utf8
          Write-Output "version.json set to $version"
          Get-Content version.json

      - name: Build .exe with PyInstaller (uses DealScraper.spec)
        run: pyinstaller --noconfirm --clean DealScraper.spec

      - name: Package dist/DealScraper into ZIP + SHA256
        shell: pwsh
        run: |
          $zipName = "DealScraper-${{ steps.version.outputs.tag }}-windows-x64.zip"
          Compress-Archive -Path dist\DealScraper\* -DestinationPath $zipName
          $size = (Get-Item $zipName).Length / 1MB
          Write-Output "ZIP-Groesse: $([math]::Round($size, 1)) MB"
          # Sidecar .sha256 Datei (Format: "<hash>  <filename>")
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath "$zipName.sha256" -Encoding ascii
          Write-Output "SHA256: $hash"
          # sha256sums.txt (bundle-Format fuer Abwaertskompatibilitaet)
          "$hash  $zipName" | Out-File -FilePath "sha256sums.txt" -Encoding ascii

      - name: Upload .zip als workflow artifact (manueller Run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: DealScraper-${{ steps.version.outputs.tag }}-windows-x64
          path: |
            DealScraper-*-windows-x64.zip
            DealScraper-*-windows-x64.zip.sha256
            sha256sums.txt
          retention-days: 30

      - name: Attach .zip + SHA256 an GitHub Release (nur bei Tag-Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DealScraper-*-windows-x64.zip
            DealScraper-*-windows-x64.zip.sha256
            sha256sums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
